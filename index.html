<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Professor Time</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box
    }

    :root {
      --bg: #f4f8fc;
      --surface: #fff;
      --surface2: #f7fbff;
      --text: #12275f;
      --text2: #31558e;
      --muted: #6f87ad;
      --blue: #1877e8;
      --blue2: #3f95ef;
      --line: #e2ebf5;
      --shadow: 0 8px 24px rgba(31, 83, 142, .08);
      --sky: #e6f4ff;
      --mint: #e6f9f0;
      --peach: #fff0ec;
      --lilac: #f0edff;
      --green: #13ad91;
      --purple: #765be8;
    }

    body.dark {
      --bg: #101b2d;
      --surface: #18263a;
      --surface2: #1d3047;
      --text: #eef5ff;
      --text2: #bdd0ed;
      --muted: #94a9c9;
      --line: #2b3d55;
      --shadow: 0 8px 24px rgba(0, 0, 0, .2);
      --sky: #193752;
      --mint: #183b34;
      --peach: #4a2d2b;
      --lilac: #30294c
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: 'Nunito', Arial, sans-serif;
      background: var(--bg);
      color: var(--text)
    }

    button,
    input,
    textarea,
    select {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .app {
      display: flex;
      min-height: 100vh
    }

    .side {
      width: 230px;
      flex: 0 0 230px;
      background: linear-gradient(180deg, #fafdff 0%, #edf6fd 100%);
      border-right: 1px solid #e1edf7;
      padding: 27px 12px 18px;
      display: flex;
      flex-direction: column
    }

    body.dark .side {
      background: var(--surface)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      margin-bottom: 30px
    }

    .brandmark {
      width: 40px;
      height: 40px;
      border: 2.5px solid var(--blue);
      border-radius: 8px 8px 11px 11px;
      position: relative;
      background: #fff;
      display: grid;
      place-items: center;
      color: var(--blue);
      font-size: 23px;
      box-shadow: 0 4px 12px rgba(24, 119, 232, .1)
    }

    .brandmark i {
      font-size: 21px
    }

    .brandmark:before {
      content: '';
      position: absolute;
      width: 2px;
      height: 30px;
      background: var(--blue);
      left: 50%;
      top: 3px;
      transform: translateX(-50%);
      opacity: .7
    }

    .brandtext b {
      display: block;
      font-size: 17px;
      line-height: 1;
      color: var(--text);
      font-weight: 800
    }

    .brandtext span {
      display: block;
      font-size: 9px;
      color: var(--blue);
      margin-top: 4px;
      font-weight: 700
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text2);
      text-align: left;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px
    }

    .nav button:hover,
    .nav .on {
      background: #dff0ff;
      color: var(--blue)
    }

    body.dark .nav button:hover,
    body.dark .nav .on {
      background: #223a56
    }

    .navicon {
      width: 18px;
      flex: 0 0 18px;
      text-align: center;
      font-size: 16px
    }

    .navicon i {
      display: block
    }

    .quote {
      margin-top: auto;
      padding: 12px 10px 4px;
      text-align: center;
      color: var(--text2);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 700;
      font-style: italic
    }

    .quote:before {
      content: '✦';
      display: block;
      color: #16b8a0;
      font-size: 19px;
      font-style: normal;
      margin-bottom: 3px
    }

    .main {
      flex: 1;
      min-width: 0
    }

    .top {
      height: 72px;
      background: rgba(255, 255, 255, .9);
      border-bottom: 1px solid #e6eef6;
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 18px;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px)
    }

    body.dark .top {
      background: rgba(24, 38, 58, .92);
      border-color: var(--line)
    }

    .search {
      width: 390px;
      max-width: 48%;
      border: 0;
      outline: 0;
      background: #eaf3fb;
      border-radius: 25px;
      padding: 12px 18px 12px 42px;
      color: var(--text);
      font-size: 11px;
      background-image: linear-gradient(transparent, transparent);
      position: relative
    }

    .search::placeholder {
      color: #8198b7
    }

    .search-wrap {
      position: relative
    }

    .search-icon {
      position: absolute;
      z-index: 2;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #52749f;
      font-size: 14px;
      pointer-events: none
    }

    .search-wrap:before {
      display: none
    }

    .topright {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 11px
    }

    .round {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 17px
    }

    .theme-toggle {
      display: flex;
      background: #e9f2fb;
      border-radius: 22px;
      padding: 3px
    }

    .theme-toggle button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: transparent
    }

    .theme-toggle .active {
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08)
    }

    .bell {
      position: relative;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 20px
    }

    .bell:after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      background: #ff5664;
      border-radius: 50%;
      right: 0;
      top: 1px;
      border: 2px solid var(--surface)
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 2px
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      ;
      display: grid;
      place-items: center;
      font-size: 21px;
      border: 2px solid #74c7f1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08)
    }

    .profile b {
      display: block;
      font-size: 11px
    }

    .profile span {
      display: block;
      font-size: 9px;
      color: var(--muted);
      margin-top: 1px
    }

    .chev {
      font-size: 16px;
      color: var(--text2);
      margin-left: 4px
    }

    .profile {
      cursor: pointer;
      position: relative
    }

    .profile-menu {
      position: absolute;
      right: 0;
      top: 50px;
      width: 190px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 14px 32px rgba(31, 83, 142, .14);
      padding: 7px;
      display: none;
      z-index: 50
    }

    .profile-menu.open {
      display: block
    }

    .profile-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 10px 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600
    }

    .profile-menu button:hover {
      background: var(--surface2);
      color: var(--blue)
    }

    .profile-menu button i {
      width: 18px;
      margin-right: 6px;
      text-align: center
    }

    .profile-menu .logout {
      color: #d9535f
    }

    .mobile-drawer-backdrop {
      display: none
    }

    .mobile-drawer {
      display: none
    }

    .mobile-menu {
      display: none
    }

    .mobile-brand {
      display: none
    }

    .mobile-brandmark {
      width: 24px;
      height: 24px;
      border: 1.8px solid var(--blue);
      border-radius: 5px 5px 7px 7px;
      position: relative;
      background: #fff;
      display: grid;
      place-items: center;
      color: var(--blue);
      font-size: 14px
    }

    .mobile-brandmark i {
      font-size: 20px
    }

    .mobile-brandmark:before {
      content: "";
      position: absolute;
      width: 1.5px;
      height: 18px;
      background: var(--blue);
      left: 50%;
      top: 2px;
      transform: translateX(-50%);
      opacity: .7
    }

    .mobile-brandtext b {
      display: block;
      font-size: 10px;
      line-height: 1;
      color: var(--text);
      font-weight: 800
    }

    .mobile-brandtext span {
      display: block;
      font-size: 5.5px;
      color: var(--blue);
      margin-top: 2px;
      font-weight: 700
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 29px 34px 40px
    }

    .page {
      background: var(--surface);
      border-radius: 23px;
      padding: 27px 21px 26px;
      box-shadow: var(--shadow);
      min-height: calc(100vh - 130px)
    }

    .hero {
      position: relative;
      padding: 0 22px 22px
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .4px;
      color: var(--blue);
      font-weight: 800
    }

    .hero h1 {
      font-size: 30px;
      line-height: 1.12;
      margin: 7px 0 5px;
      font-weight: 800;
      letter-spacing: -.6px
    }

    .hero p {
      margin: 0;
      color: var(--text2);
      font-size: 13px
    }

    .hero-note {
      position: absolute;
      right: 20px;
      top: 1px;
      width: 145px;
      text-align: center;
      color: #365b91;
      font-size: 12px;
      line-height: 1.25;
      font-style: italic;
      font-weight: 700;
      transform: rotate(-2deg)
    }

    .bulb {
      display: block;
      font-style: normal;
      font-size: 31px;
      margin-top: 2px
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      padding: 0 0
    }

    .action {
      min-height: 183px;
      border: 0;
      border-radius: 18px;
      padding: 22px 14px 15px;
      text-align: center;
      box-shadow: none;
      transition: .18s;
      color: var(--text);
      position: relative;
      overflow: hidden
    }

    .action:after {
      content: '';
      position: absolute;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      right: -35px;
      bottom: -42px;
      background: rgba(255, 255, 255, .25)
    }

    .action:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 20px rgba(38, 91, 145, .1)
    }

    .action.sky {
      background: var(--sky)
    }

    .action.mint {
      background: var(--mint)
    }

    .action.peach {
      background: var(--peach)
    }

    .action.lilac {
      background: var(--lilac)
    }

    .action-icon {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
      font-size: 28px;
      background: rgba(255, 255, 255, .45)
    }

    .sky .action-icon {
      color: #0877eb
    }

    .mint .action-icon {
      color: #00a58b
    }

    .peach .action-icon {
      color: #f04d48
    }

    .lilac .action-icon {
      color: #765be8
    }

    .action h3 {
      font-size: 14px;
      margin: 0 0 6px;
      font-weight: 800
    }

    .action p {
      font-size: 11px;
      color: #6380a8;
      line-height: 1.35;
      margin: 0 auto;
      max-width: 170px
    }

    .arrow {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 12px auto 0;
      color: #fff;
      font-size: 12px;
      line-height: 1
    }

    .arrow i {
      font-size: 11px
    }

    .sky .arrow {
      background: #4e9af0
    }

    .mint .arrow {
      background: #1bb8a1
    }

    .peach .arrow {
      background: #ff8c77
    }

    .lilac .arrow {
      background: #8a6df1
    }

    .assistant-banner {
      margin-top: 16px;
      border-radius: 17px;
      background: linear-gradient(100deg, #eaf5ff, #edf7ff);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 22px;
      min-height: 92px
    }

    .bot {
      width: 95px;
      height: 72px;
      flex: 0 0 95px;
      border-radius: 35px 35px 28px 28px;
      background: linear-gradient(145deg, #fff, #dcecff);
      box-shadow: 0 6px 18px rgba(58, 106, 163, .15);
      display: grid;
      place-items: center;
      font-size: 42px;
      position: relative
    }

    .bot:before {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #37d4df;
      top: 27px;
      left: 34px;
      box-shadow: 20px 0 #37d4df
    }

    .assistant-copy {
      flex: 1
    }

    .assistant-copy h2 {
      font-size: 15px;
      margin: 0 0 3px
    }

    .assistant-copy p {
      font-size: 11px;
      color: var(--text2);
      margin: 0;
      line-height: 1.4
    }

    .assistant-banner .primary {
      white-space: nowrap
    }

    .primary {
      border: 0;
      background: var(--blue);
      color: #fff;
      border-radius: 12px;
      padding: 11px 18px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 5px 13px rgba(24, 119, 232, .18)
    }

    .primary:hover {
      background: #086bd7
    }

    .secondary {
      background: var(--surface);
      color: var(--text2);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700
    }

    .secondary:hover {
      border-color: #9bc7f2
    }

    .recent {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 17px 18px;
      background: var(--surface)
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px
    }

    .section-head h2 {
      font-size: 16px;
      margin: 0
    }

    .linkbtn {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 11px;
      font-weight: 800
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .project-card {
      border: 1px solid #e5edf5;
      border-radius: 13px;
      padding: 14px;
      background: #fff;
      min-height: 135px;
      position: relative
    }

    .project-card .mini-icon {
      width: 43px;
      height: 43px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 21px;
      margin-bottom: 10px
    }

    .mini-sky {
      background: #dff5f4;
      color: #00a58b
    }

    .mini-lilac {
      background: #ece8ff;
      color: #7258df
    }

    .mini-peach {
      background: #ffe8df;
      color: #ef735e
    }

    .project-card b {
      font-size: 12px
    }

    .project-card small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 4px
    }

    .project-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 13px;
      color: var(--muted);
      font-size: 10px
    }

    .dots {
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 18px;
      line-height: 1
    }

    .continue-row {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 14px;
      margin-top: 15px
    }

    .continue-card,
    .tip-card {
      border-radius: 17px;
      padding: 18px 20px;
      min-height: 128px
    }

    .continue-card {
      background: linear-gradient(135deg, #e5fbf4, #eefcf9);
      display: flex;
      align-items: center;
      gap: 16px
    }

    .continue-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .55);
      display: grid;
      place-items: center;
      font-size: 30px;
      color: #0aa992;
      flex: 0 0 64px
    }

    .continue-card h3,
    .tip-card h3 {
      font-size: 14px;
      margin: 0 0 5px
    }

    .continue-card p,
    .tip-card p {
      font-size: 11px;
      color: var(--text2);
      line-height: 1.45;
      margin: 0 0 10px
    }

    .tip-card {
      background: linear-gradient(135deg, #eaf6ff, #e1f2ff);
      display: flex;
      gap: 16px;
      align-items: center
    }

    .tip-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .55);
      display: grid;
      place-items: center;
      font-size: 28px;
      flex: 0 0 58px
    }

    /* Inner pages */
    .title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px
    }

    .title h1 {
      font-size: 24px;
      margin: 5px 0 0
    }

    .form {
      max-width: 850px;
      margin: auto
    }

    .field {
      margin-bottom: 19px
    }

    .field label {
      font-size: 11px;
      font-weight: 800;
      display: block;
      margin-bottom: 8px
    }

    .input,
    .textarea,
    .select {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 13px;
      outline: 0;
      font-size: 12px
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: #7eb9f3;
      box-shadow: 0 0 0 3px rgba(24, 119, 232, .07)
    }

    .textarea {
      min-height: 100px;
      resize: vertical
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px
    }

    .pill {
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text2);
      border-radius: 999px;
      font-size: 11px
    }

    .pill.sel {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue)
    }

    .objectives {
      display: grid;
      gap: 7px
    }

    .obj {
      padding: 12px;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text2);
      border-radius: 11px;
      font-size: 11px
    }

    .obj.sel {
      background: #e6f4ff;
      border-color: #83bbf0;
      color: #1766bc
    }

    .sources {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px
    }

    .source {
      padding: 13px;
      border: 1px dashed #cbdceb;
      background: var(--surface2);
      color: var(--text);
      border-radius: 12px;
      text-align: left
    }

    .source b {
      display: block;
      font-size: 19px;
      margin-bottom: 6px
    }

    .source small {
      display: block;
      color: var(--muted);
      font-size: 9px;
      margin-top: 3px
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: var(--shadow);
      padding: 19px
    }

    .card h2 {
      font-size: 15px;
      margin: 0 0 8px
    }

    .card p,
    .card li {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6
    }

    .lesson {
      max-width: 900px;
      margin: auto
    }

    .lesson-card {
      margin-bottom: 10px
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap
    }

    .chat {
      position: sticky;
      bottom: 12px;
      margin-top: 14px;
      padding: 13px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(40, 85, 130, .12)
    }

    .chips {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 8px
    }

    .chip {
      border: 0;
      background: #eaf3fb;
      color: var(--text2);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 10px
    }

    .chatrow {
      display: flex;
      gap: 8px
    }

    .chatrow .input {
      flex: 1
    }

    .response {
      font-size: 10px;
      color: var(--muted);
      margin-top: 8px
    }

    .projects {
      display: grid;
      gap: 9px
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 32px;

<div class="actions"><button class="action sky" onclick="go('create')"><div class="action-icon"><i class="fa-solid fa-book-open"></i></div><div><h3>Criar uma aula</h3><p>Prepare uma aula completa com o auxílio da IA.</p></div><span class="arrow"><i class="fa-solid fa-chevron-right"></i></span></button><button class="action mint" onclick="go('create')"><div class="action-icon"><i class="fa-solid fa-file-pen"></i></div><div><h3>Criar uma atividade</h3><p>Gere atividades práticas, exercícios e dinâmicas.</p></div><span class="arrow"><i class="fa-solid fa-chevron-right"></i></span></button><button class="action peach" onclick="go('create')"><div class="action-icon"><i class="fa-solid fa-chart-column"></i></div><div><h3>Criar uma avaliação</h3><p>Crie questões, avaliações e gabaritos.</p></div><span class="arrow"><i class="fa-solid fa-chevron-right"></i></span></button><button class="action lilac" onclick="go('materials')"><div class="action-icon"><i class="fa-regular fa-folder"></i></div><div><h3>Meus materiais</h3><p>Organize e utilize seus arquivos como referência.</p></div><span class="arrow"><i class="fa-solid fa-chevron-right"></i></span></button></div>
<div class="assistant-banner"><div class="bot"><i class="fa-solid fa-robot" style="color: rgb(98, 176, 245);"></i></div><div class="assistant-copy"><h2>Precisa de alguma coisa?</h2><p>Converse com seu assistente de IA. Tire dúvidas, peça sugestões<br class="desktop-only"> e receba ajuda em qualquer etapa do seu planejamento.</p></div><button class="primary" onclick="go('assistant')"><i class="fa-regular fa-comment-dots"></i> Abrir assistente</button></div>
<div class="recent"><div class="section-head"><h2><i class="fa-regular fa-folder"></i> &nbsp; Meus projetos recentes</h2><button class="linkbtn" onclick="go('projects')">Ver todos →</button></div>${recentProjects()}</div>
<div class="continue-row"><div class="continue-card"><div class="continue-icon"><i class="fa-solid fa-file-pen"></i></div><div><h3>Continue de onde parou</h3><p>Retome seu último projeto e continue planejando sua aula.</p><button class="primary" onclick="S.projects.length?openProject(S.projects.length-1):go('create')">Continuar projeto →</button></div></div><div class="tip-card"><div class="tip-icon"><i class="fa-regular fa-lightbulb"></i></div><div><h3>Dica do dia</h3><p><i>“Pequenas mudanças na forma de ensinar podem gerar grandes transformações na vida dos seus alunos.”</i></p></div></div></div></div>`)
    }
    function recentProjects() { if (!S.projects.length) return `<div class="empty">Seus projetos recentes aparecerão aqui.</div>`; let arr = S.projects.slice(-3).reverse(); return `<div class="project-grid">${arr.map((p, i) => `<div class="project-card"><div class="mini-icon ${i === 0 ? 'mini-sky' : i === 1 ? 'mini-lilac' : 'mini-peach'}">${i === 0 ? '<i class="fa-solid fa-diagram-project"></i>' : i === 1 ? '<i class="fa-solid fa-graduation-cap"></i>' : '<i class="fa-regular fa-lightbulb"></i>'}</div><b>${esc(p.title)}</b><small>${esc(p.audience)} · ${esc(p.duration)}</small><div class="project-footer"><span><i class="fa-regular fa-clock"></i> &nbsp;${i === 0 ? 'Editado hoje' : i === 1 ? 'Editado ontem' : 'Editado há 3 dias'}</span><button class="dots" onclick="openProject(${S.projects.length - 1 - i})" aria-label="Mais opções"><i class="fa-solid fa-ellipsis-vertical"></i></button></div></div>`).join('')}</div>` }
    function create() { let l = S.lesson || {}; nav('create', `<div class="page"><div class="title"><div><div class="eyebrow">NOVO PROJETO</div><h1>Criar uma aula</h1></div><button class="secondary" onclick="go('home')"><i class="fa-solid fa-arrow-left"></i> Voltar</button></div><div class="form"><div class="card"><div class="field"><label>Tema da aula</label><input id="topic" class="input" value="${esc(l.title || '')}" placeholder="Ex.: Introdução à Inteligência Artificial"></div><div class="field"><label>Público / nível</label><select id="audience" class="select">${['Educação Infantil', 'Ensino Fundamental', 'Ensino Médio', 'Ensino Técnico', 'Graduação', 'Pós-graduação', 'Educação Profissional', 'Outro'].map(x => `<option ${l.audience === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div><div class="field"><label>Duração</label><div class="pills" id="dur">${['30 min', '1h', '1h30', '2h', '2h30', '3h', '3h30', '4h'].map(x => `<button class="pill ${x === (l.duration || '2h') ? 'sel' : ''}" onclick="duration(this)">${x}</button>`).join('')}</div></div><div class="field"><label>Qual é o objetivo da aula?</label><div class="objectives" id="objs"><button class="obj" onclick="objective(this)">Compreender os conceitos fundamentais do tema</button><button class="obj" onclick="objective(this)">Identificar aplicações e exemplos no cotidiano</button><button class="obj" onclick="objective(this)">Analisar características e implicações do tema</button><button class="obj" onclick="objective(this)">Desenvolver uma atividade prática relacionada ao tema</button><button class="obj ${l.objective ? 'sel' : ''}" onclick="customObj()"><i class="fa-solid fa-pencil"></i> ${l.objective ? esc(l.objective) : 'Quero informar meu próprio objetivo'}</button></div></div><div class="field"><label>Preferências ou observações <span style="color:var(--muted);font-weight:400">(opcional)</span></label><textarea id="notes" class="textarea" placeholder="Ex.: Quero uma aula mais prática, com atividade em grupo.">${esc(l.notes || '')}</textarea></div></div><div class="card" style="margin-top:12px"><h2><i class="fa-regular fa-file"></i> Materiais de referência <span style="font-size:10px;color:var(--muted);font-weight:400">(opcional)</span></h2><p>Adicione conteúdos que gostaria que o assistente considerasse.</p><div class="sources">${[['<i class="fa-solid fa-file-pdf" style="color: rgb(168, 25, 50);"></i>', 'PDF'], ['<i class="fa-solid fa-file-word" style="color: rgb(14, 90, 218);"></i>', 'Word'], ['<i class="fa-solid fa-font"></i>', 'Texto'], ['<i class="fa-solid fa-earth-americas"></i>', 'Site'], ['<i class="fa-brands fa-youtube" style="color: rgba(177, 21, 49, 1.00)"></i>', 'YouTube'], ['<i class="fa-solid fa-microphone" style="color: rgba(41, 227, 170, 1.00)"></i>', 'Áudio']].map(x => `<button class="source" onclick="source('${x[1]}')"><b>${x[0]}</b>${x[1]}<small>Adicionar</small></button>`).join('')}</div></div><button class="primary" style="width:100%;margin-top:12px" onclick="generate()">✨ Criar minha aula</button></div></div>`) }
    function duration(el) { document.querySelectorAll('#dur .pill').forEach(x => x.classList.remove('sel')); el.classList.add('sel') } function objective(el) { document.querySelectorAll('.obj').forEach(x => x.classList.remove('sel')); el.classList.add('sel') } function customObj() { let v = prompt('Qual é o objetivo da aula?'); if (v) { let b = [...document.querySelectorAll('.obj')].at(-1); b.textContent = '✏️ ' + v; b.classList.add('sel'); document.querySelectorAll('.obj').forEach(x => { if (x !== b) x.classList.remove('sel') }) } } function source(type) { alert(type + ' selecionado. O upload real será conectado na próxima etapa.') }
    function generate() { let topic = $('#topic').value.trim() || 'Introdução ao tema', aud = $('#audience').value, dur = $('#dur .sel').textContent, obj = $('#objs .sel')?.textContent.replace('✏️ ', '') || 'Compreender os conceitos fundamentais do tema', notes = $('#notes').value; S.lesson = { title: topic, audience: aud, duration: dur, objective: obj, notes }; if (S.lesson.index != null && S.projects[S.lesson.index]) S.projects[S.lesson.index] = { ...S.projects[S.lesson.index], ...S.lesson }; else { S.projects.push({ ...S.lesson }); S.lesson.index = S.projects.length - 1 } save(); go('lesson') }
    function lesson() { let l = S.lesson; nav('projects', `<div class="page"><div class="title"><div><div class="eyebrow">PROJETO</div><h1><i class="fa-solid fa-book-open"></i> ${esc(l.title)}</h1><span style="font-size:10px;color:var(--muted)">${esc(l.audience)} · ${esc(l.duration)}</span></div><button class="secondary" onclick="go('projects')"><i class="fa-regular fa-folder"></i> Projetos</button></div><div class="lesson"><div class="toolbar"><button class="secondary" onclick="go('create')"><i class="fa-solid fa-pencil"></i> Editar informações</button><button class="secondary" onclick="alert('Exportação será adicionada depois.')"><i class="fa-regular fa-file-arrow-down"></i> Exportar</button></div><div class="card lesson-card"><h2><i class="fa-solid fa-bullseye"></i> Objetivo da aula</h2><p>${esc(l.objective)}.</p></div><div class="card lesson-card"><h2><i class="fa-solid fa-book-open"></i> Conteúdos</h2><ul><li>Conceitos fundamentais de ${esc(l.title)}</li><li>Principais características e aplicações</li><li>Exemplos relacionados ao contexto dos estudantes</li></ul></div><div class="card lesson-card"><h2><i class="fa-solid fa-chalkboard-user"></i> Desenvolvimento da aula</h2><p><b>Introdução</b> — contextualização e ativação dos conhecimentos prévios.</p><p><b>Desenvolvimento</b> — apresentação dos conceitos com exemplos.</p><p><b>Atividade</b> — aplicação prática ou colaborativa.</p><p><b>Fechamento</b> — síntese e verificação da aprendizagem.</p></div><div class="card lesson-card"><h2><i class="fa-regular fa-lightbulb"></i> Atividade sugerida</h2><p>Propor uma atividade prática em pequenos grupos relacionada ao tema, seguida de socialização dos resultados.</p></div><div class="card lesson-card"><h2><i class="fa-solid fa-circle-check"></i> Avaliação</h2><p>Verificar a compreensão por meio de perguntas rápidas, observação da atividade e uma produção final curta.</p></div><div class="chat"><div class="chips"><button class="chip" onclick="quick('simplificar')">Simplificar</button><button class="chip" onclick="quick('aprofundar')">Aprofundar</button><button class="chip" onclick="quick('atividade')">Criar atividade</button><button class="chip" onclick="quick('avaliação')">Criar avaliação</button></div><div class="chatrow"><input id="chat" class="input" placeholder="O que você gostaria de mudar?"><button class="primary" onclick="send()">Enviar</button></div><div id="reply" class="response"></div></div></div></div>`) }
    function quick(a) { let m = { simplificar: 'Vou simplificar a linguagem mantendo o objetivo da aula.', aprofundar: 'Vou aprofundar os conceitos e acrescentar exemplos.', atividade: 'Vou preparar uma atividade prática alinhada à aula.', avaliação: 'Vou preparar uma avaliação coerente com o conteúdo.' }; $('#reply').textContent = '🤖 ' + m[a] } function send() { let v = $('#chat').value.trim(); if (v) { $('#reply').textContent = '🤖 Entendi: "' + v + '". Nesta versão, a resposta é simulada.'; $('#chat').value = '' } }
    function projects() { nav('projects', `<div class="page"><div class="title"><div><div class="eyebrow">SEUS TRABALHOS</div><h1>Meus projetos</h1></div><button class="primary" onclick="go('create')"><i class="fa-solid fa-plus"></i> Nova aula</button></div><div class="card"><input class="input" placeholder="Buscar projeto..." style="margin-bottom:12px" oninput="searchProjects(this.value,'project-list')"><div id="project-list" class="projects">${projectList()}</div></div></div>`) }
    function projectList() { if (!S.projects.length) return `<div class="empty">Você ainda não criou projetos.<br><button class="primary" style="margin-top:12px" onclick="go('create')"><i class="fa-solid fa-plus"></i> Criar minha primeira aula</button></div>`; return S.projects.slice().reverse().map((p, i) => `<div class="project-card" style="min-height:80px;display:flex;align-items:center;gap:12px"><div class="mini-icon mini-sky" style="margin:0"><i class="fa-solid fa-diagram-project"></i></div><div style="flex:1"><b>${esc(p.title)}</b><small>${esc(p.audience)} · ${esc(p.duration)}</small></div><button class="secondary" onclick="openProject(${S.projects.length - 1 - i})">Continuar</button></div>`).join('') }
    function searchProjects(q, target) { if (!q) return; let list = S.projects.filter(p => p.title.toLowerCase().includes(q.toLowerCase())); if (target) { let el = document.getElementById(target); if (el) el.innerHTML = list.length ? list.map((p) => `<div class="project-card" style="min-height:80px;display:flex;align-items:center;gap:12px"><div class="mini-icon mini-sky" style="margin:0"><i class="fa-solid fa-diagram-project"></i></div><div style="flex:1"><b>${esc(p.title)}</b><small>${esc(p.audience)} · ${esc(p.duration)}</small></div><button class="secondary" onclick="openProject(${S.projects.indexOf(p)})">Continuar</button></div>`).join('') : `<div class="empty">Nenhum projeto encontrado.</div>` } }
    function openProject(i) { S.lesson = { ...S.projects[i], index: i }; go('lesson') } function materials() { nav('materials', `<div class="page"><div class="title"><div><div class="eyebrow">BIBLIOTECA</div><h1>Meus materiais</h1></div><button class="primary" onclick="alert('Upload real será integrado depois.')"><i class="fa-solid fa-plus"></i> Adicionar material</button></div><div class="card"><div class="empty">Seus PDFs, documentos, links, vídeos, textos e áudios aparecerão aqui.</div></div></div>`) }
    function assistant() { nav('assistant', `<div class="page"><div class="title"><div><div class="eyebrow">INTELIGÊNCIA ARTIFICIAL</div><h1>Assistente</h1></div></div><div class="card" style="max-width:820px;margin:auto"><h2>Como posso ajudar?</h2><p>Comece uma ideia ou peça ajuda para preparar seu próximo conteúdo.</p><div class="chips"><button class="chip" onclick="fill('Quero criar uma aula sobre...')">Criar uma aula</button><button class="chip" onclick="fill('Crie uma atividade sobre...')">Criar atividade</button><button class="chip" onclick="fill('Preciso de uma avaliação sobre...')">Criar avaliação</button></div><div class="chatrow"><input id="global" class="input" placeholder="Escreva o que você precisa..."><button class="primary" onclick="globalSend()">Enviar</button></div><div id="globalReply" class="response"></div></div></div>`) }
    function fill(v) { $('#global').value = v } function globalSend() { let v = $('#global').value.trim(); if (v) $('#globalReply').textContent = '🤖 Entendi. Nesta versão navegável, a resposta é simulada.' }
    function settings() { nav('settings', `<div class="page"><div class="title"><div><div class="eyebrow">PREFERÊNCIAS</div><h1>Configurações</h1></div></div><div class="card" style="max-width:720px;margin:auto"><h2>Meu perfil</h2><div class="field"><label>Nome</label><input class="input" value="Ana"></div><div class="field"><label>Área de atuação</label><input class="input" placeholder="Ex.: Tecnologia, História, Matemática"></div><div class="field"><label>Nível de ensino principal</label><select class="select"><option>Ensino Técnico</option><option>Ensino Fundamental</option><option>Ensino Médio</option><option>Graduação</option></select></div><h2 style="margin-top:23px">Aparência</h2><div class="pills"><button class="pill ${S.theme === 'light' ? 'sel' : ''}" onclick="setTheme('light')"><i class="fa-regular fa-sun"></i> Claro</button><button class="pill ${S.theme === 'dark' ? 'sel' : ''}" onclick="setTheme('dark')"><i class="fa-regular fa-moon"></i> Escuro</button></div></div></div>`) }
    document.addEventListener('click', e => { const m = document.getElementById('profileMenu'), p = e.target.closest('.profile'); if (m && m.classList.contains('open') && !p) m.classList.remove('open') }); document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMobileMenu(); const m = document.getElementById('profileMenu'); if (m) m.classList.remove('open') } }); function render() { let p = location.hash.replace('#', '') || 'home'; ({ home, create, lesson, projects, materials, assistant, settings }[p] || home)() } render();
  </script>
</body>

</html>
